name: ech_http
description: An HTTP client with explicit TLS Encrypted Client Hello, proxy support, and a C++ backend bundled through Dart build hooks.
version: 0.2.1
repository: https://github.com/ech-research/ech_http
issue_tracker: https://github.com/ech-research/ech_http/issues
# Deliberately public test-only key; never used by the runtime library.
false_secrets:
  - /test/fixtures/localhost-key.pem
environment:
  sdk: '>=3.10.0 <4.0.0'
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
topics:
  - http
  - tls
  - ech
  - ffi
  - networking
dependencies:
  archive: ^4.0.9
  # Flutter-OH 3.41 pins meta 1.17; hooks 2.2 requires meta 1.19.
  # The build hook uses APIs available in both protocol package generations.
  code_assets: '>=1.2.1 <3.0.0'
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: '>=2.0.2 <3.0.0'
  http: ^1.6.0
  path: ^1.9.1
dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
